spring.application.name=notification-service

spring.datasource.url=jdbc:mysql://notification-mysql:3306/notification_db
spring.datasource.username=root
spring.datasource.password=Arun@2200
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://eureka-service:8761/eureka/
eureka.client.fetch-register=true
eureka.instance.prefer-ip-address=true

spring.kafka.bootstrap-servers=kafka:9093

spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.course_blogging.notification_service.event.UserCreateEvent

